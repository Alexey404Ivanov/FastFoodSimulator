<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food Simulator</title>
    <link rel="stylesheet" href="../static/css/home.css">
</head>
<body>
    <header class="page-header">
    </header>

    <main class="page-content">
        <section class="simulation-card">
            <h1>Укажите данные симуляции</h1>
            <p>Введите числовые интервалы и выберите единицу времени для каждого этапа.</p>

            <form class="simulation-form" id="simulationForm">
                <div class="field-group">
                    <label for="arrivalInterval">Интервал прибытия клиентов</label>
                    <div class="field-control">
                        <input id="arrivalInterval" name="client_interval_seconds" type="number" min="0" step="1" placeholder="Введите число" required>
                        <span>сек.</span>
                    </div>
                </div>

                <div class="field-group">
                    <label for="orderInterval">Интервал оформления заказа</label>
                    <div class="field-control">
                        <input id="orderInterval" name="cashier_interval_seconds" type="number" min="0" step="1" placeholder="Введите число" required>
                        <span>сек.</span>
                    </div>
                </div>

                <div class="field-group">
                    <label for="cookingInterval">Интервал готовки заказа</label>
                    <div class="field-control">
                        <input id="cookingInterval" name="kitchen_interval_seconds" type="number" min="0" step="1" placeholder="Введите число" required>
                        <span>сек.</span>
                    </div>
                </div>

                <div class="field-group">
                    <label for="pickupInterval">Интервал выдачи заказа</label>
                    <div class="field-control">
                        <input id="pickupInterval" name="waiter_interval_seconds" type="number" min="0" step="1" placeholder="Введите число" required>
                        <span>сек.</span>
                    </div>
                </div>

                <div id="simulationFormError" class="simulation-form-error" role="alert" aria-live="polite"></div>
                <button class="submit-button" type="submit">Запустить симуляцию</button>
            </form>
        </section>
    </main>

    <script src="../static/js/home.js"></script>
</body>
</html>
