<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция</title>
    <link rel="stylesheet" href="../static/css/simulation_1488.css">
</head>
<body>
    <div class="screen-frame" aria-hidden="true"></div>

    <div class="floating-controls">
        <button id="continueButton" class="control-button" type="button">Продолжить</button>
        <button id="pauseButton" class="control-button control-button-stop" type="button">Стоп</button>
        <div class="timer-display">Время работы симуляции: 00.00</div>
    </div>

    <div class="floating-settings-panel">
        <button id="simulationSettingsButton" class="control-button" type="button">Изменить настройки симуляции</button>
    </div>

    <div id="simulationSettingsModal" class="settings-modal-overlay" hidden>
        <form id="simulationSettingsForm" class="settings-modal" aria-labelledby="simulationSettingsTitle">
            <button id="simulationSettingsCloseButton" class="settings-modal-close" type="button" aria-label="Закрыть окно настроек">&times;</button>
            <h2 id="simulationSettingsTitle" class="settings-modal-title">Настройки симуляции</h2>

            <div class="settings-modal-fields">
                <label class="settings-field">
                    <span>Интервал прибытия клиентов</span>
                    <input id="clientIntervalInput" name="client" type="number" min="1" step="1" required>
                </label>

                <label class="settings-field">
                    <span>Интервал оформления заказа</span>
                    <input id="cashierIntervalInput" name="cashier" type="number" min="1" step="1" required>
                </label>

                <label class="settings-field">
                    <span>Интервал готовки заказа</span>
                    <input id="kitchenIntervalInput" name="kitchen" type="number" min="1" step="1" required>
                </label>

                <label class="settings-field">
                    <span>Интервал выдачи заказа</span>
                    <input id="waiterIntervalInput" name="waiter" type="number" min="1" step="1" required>
                </label>
            </div>

            <div id="simulationSettingsError" class="settings-modal-error" role="alert" aria-live="polite"></div>
            <button id="simulationSettingsSubmitButton" class="control-button settings-modal-submit" type="submit">Применить изменения</button>
        </form>
    </div>

    <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

    <header class="page-header">
    </header>

    <main class="page-content">
        <section class="worker-tree" aria-label="Схема воркеров">
            <div class="worker-children">
                <div class="worker-node worker-node-cashier">
                    <img src="../static/images/workers/cashier.svg" alt="Cashier worker">
                    <div class="worker-state">
                        <div class="worker-current">
                            <div class="client-slot" id="cashierCurrentClient"></div>
                        </div>

                        <div class="worker-queue">
                            <div class="client-queue" id="cashierQueue"></div>
                        </div>
                    </div>
                </div>

                <div class="worker-node worker-node-root">
                    <div class="kitchen-state">
                        <div class="ticket-line ticket-line-queue" id="kitchenQueue"></div>
                        <div class="ticket-line ticket-line-doing" id="kitchenDoing"></div>
                    </div>
                    <img src="../static/images/workers/kitchen.svg" alt="Kitchen worker">
                    <div class="waiter-table-node">
                        <div class="burger-queue" id="waiterBurgerQueue"></div>
                        <img src="../static/images/waiter_table.svg" alt="Waiter table">
                    </div>
                </div>

                <div class="worker-node worker-node-waiter">
                    <img src="../static/images/workers/waiter.svg" alt="Waiter worker">
                    <div class="worker-state">
                        <div class="worker-current">
                            <div class="client-slot" id="waiterCurrentClient"></div>
                        </div>

                        <div class="worker-queue">
                            <div class="client-queue" id="waiterClientQueue"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../static/js/simulation_1488.js"></script>
</body>
</html>
