<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция</title>
    <link rel="stylesheet" href="../static/css/simulation_1488.css">
</head>
<body>
    <div class="screen-frame" aria-hidden="true"></div>

    <div class="floating-controls">
        <button id="continueButton" class="control-button" type="button">Продолжить</button>
        <button id="pauseButton" class="control-button control-button-stop" type="button">Стоп</button>
        <div class="timer-display">Время работы симуляции: 00.00</div>
    </div>

    <header class="page-header">
    </header>

    <main class="page-content">
        <section class="worker-tree" aria-label="Схема воркеров">
            <div class="worker-node worker-node-root">
                <div class="kitchen-state">
                    <div class="ticket-line ticket-line-queue" id="kitchenQueue"></div>
                    <div class="ticket-line ticket-line-doing" id="kitchenDoing"></div>
                </div>
                <img src="../static/images/workers/kitchen.svg" alt="Kitchen worker">
            </div>

            <div class="worker-children">
                <div class="worker-node worker-node-cashier">
                    <img src="../static/images/workers/cashier.svg" alt="Cashier worker">
                    <div class="worker-state">
                        <div class="worker-current">
                            <div class="client-slot" id="cashierCurrentClient"></div>
                        </div>

                        <div class="worker-queue">
                            <div class="client-queue" id="cashierQueue"></div>
                        </div>
                    </div>
                </div>

                <div class="worker-node worker-node-waiter">
                    <img src="../static/images/workers/waiter.svg" alt="Waiter worker">
                    <div class="worker-state">
                        <div class="worker-current">
                            <div class="client-slot" id="waiterCurrentClient"></div>
                        </div>

                        <div class="worker-queue">
                            <div class="client-queue" id="waiterQueue"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../static/js/simulation_1488.js"></script>
</body>
</html>
